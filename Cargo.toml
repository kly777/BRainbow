[package]
name = "brainbow"
version = "0.1.0"
edition = "2024"

# db-viewer：数据库浏览工具（生产构建用 --no-default-features 关闭）
[features]
default = ["db-viewer"]
db-viewer = []

[dependencies]
async-trait = "0.1"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
dotenvy = "0.15"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1.52.3", features = ["full"] }
csv = "1.3"
tokio-util = { version = "0.7", features = ["io"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono", "macros"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

serde_json = "1.0"
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

bcrypt = "0.19.2"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
sha2 = "0.10"
hex = "0.4"
fsrs = "6.6.1"

nanoid = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
infer = "0.19"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
eventsource-stream = "0.2.3"

[lints.clippy]
# 自动修复类（cargo clippy --fix 一键修完）
uninlined_format_args = "warn"
redundant_closure = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
single_match_else = "warn"
unnecessary_struct_initialization = "warn"
needless_return = "warn"
redundant_clone = "warn"
# 值得关注的（手动修复）
needless_pass_by_value = "warn"
# cast 相关：FSRS 数学 + 分页计算全部有意使用 as，降为 allow
cast_possible_truncation = "allow"
cast_precision_loss = "allow"

[profile.release]
# Strip debug symbols to reduce binary size by ~30%
strip = "symbols"

# Thin LTO for better optimization with reasonable compile time
# Use "fat" for maximum optimization (slower compile)
lto = "thin"

# Optimize for size without sacrificing too much performance
# opt-level = "z"  # Uncomment for minimum size
# opt-level = 3    # Default: maximum performance

