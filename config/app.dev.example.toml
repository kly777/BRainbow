# 开发环境：后端 runtime + Vite dev
# 复制为 config/app.dev.toml 使用（真实文件被 gitignore）
version = 1

[server]
port = 3000
bind = "127.0.0.1"

[security]
allow_register = false
jwt_ttl_secs = 864000

[site]
url = "http://localhost:3001"

[cors]
allow_origins = ["http://localhost:3001"]

[frontend]
port = 3001
api_target = "http://localhost:3000"

