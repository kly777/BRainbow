# 静态 ffmpeg 的版本与校验和（一行：<版本> <sha256>）
#
# 由 `cargo xtask fetch-ffmpeg`（just fetch-ffmpeg）读取；版本与 sha256 必须成对更新。
# 首次获取：把 `<版本> <sha256>` 填到下面这一行；留占位（`__*` / `PENDING*` / `TODO*`）
# 时脚本会拒绝下载，并把取哈希的命令打给你。
#
# 为什么不用"latest"：远端跑的是解不可信视频的二进制，版本要可复现、可追溯。
